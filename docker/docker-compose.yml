services:
  mongo:
    image: mongo:8

    ports:
      - "27007:27017"

    volumes:
      - mongo_data:/data/db

    env_file:
      - ./env/.env.mongo

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    networks:
      - backend


  qdrant:
    image: qdrant/qdrant:v1.13.6

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

    networks:
      - backend
      - monitoring


  prometheus:
    image: prom/prometheus:v3.3.0

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

    networks:
      - backend
      - monitoring


  grafana:
    image: grafana/grafana:11.6.0-ubuntu

    ports:
      - "3000:3000"

    env_file:
      - ./env/.env.grafana

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

    depends_on:
      - prometheus

    networks:
      - monitoring


networks:
  backend:
  monitoring:


volumes:
  mongo_data:
  qdrant_data:
  prometheus_data:
  grafana_data: