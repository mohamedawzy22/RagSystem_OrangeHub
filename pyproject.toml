[project]
name = "ragsystem-orangehub"
version = "0.1.0"
description = "RAG System for Orange Hub"
readme = "README.md"
authors = [
    { name = "Mohamed Fawzy", email = "mohamedawzy400@gmail.com" }
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]