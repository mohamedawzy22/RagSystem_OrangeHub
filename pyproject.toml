[project]
name = "ragsystem-orangehub"
version = "0.1.0"
description = "RAG System for Orange Hub"
readme = "README.md"
authors = [
    { name = "Mohamed Fawzy", email = "mohamedawzy400@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "motor>=3.7.1",
    "ollama>=0.6.2",
    "openai>=3.14.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=75"

[tool.ruff.lint]
extend-ignore = ["B008"]
